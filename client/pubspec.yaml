name: stock
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  dio: ^5.9.1
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  google_fonts: ^8.0.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.6.2
  riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.4
  mobile_scanner: ^5.2.3
  pdf: ^3.11.1
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  google_sign_in: 7.2.0
  font_awesome_flutter: 10.7.0
  printing: ^5.14.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  adaptive_icon_background: "#FFFFFF" 
  adaptive_icon_foreground: "logo.png"
  min_sdk_android: 21


flutter:
  generate: true
  uses-material-design: true

  assets:
    - logo.png
    - assets/icons/